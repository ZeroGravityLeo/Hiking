<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b6046" />
    <title>Wild Alberta Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #f8f3e7;
        color: #102520;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid #d9ccb4;
        border-radius: 8px;
        background: white;
        padding: 20px;
        box-shadow: 0 16px 40px rgb(16 37 32 / 10%);
      }

      h1 {
        font-size: 24px;
        margin: 0 0 8px;
      }

      p {
        color: #5a6b65;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Offline mode</h1>
      <p>
        Wild Alberta cannot load a fresh page right now. Reopen a cached screen or reconnect to
        continue. Completed activities saved offline will sync when the app is online again.
      </p>
    </main>
  </body>
</html>
